name: workspace_resolver
publish_to: none
environment:
  sdk: ^3.10.0

workspace:
  - client_auth
  - client_data
  - shared_data

dependencies:
  data_layer: ^0.0.2
  data_layer_flutter: ^0.0.2
  data_layer_hive: ^0.0.2
  equatable: ^2.0.8
  freezed_annotation: ^3.1.0
  hive_ce: ^2.19.1
  hive_ce_flutter: ^2.3.4
  http: ^1.6.0
  json_annotation: ^4.9.0
  logging: ^1.3.0
  matcher: ^0.12.18
  meta: ^1.18.0
  serverpod_auth_core_client: ^3.2.3
  serverpod_auth_idp_client: ^3.2.3
  uuid: ^4.5.2

dev_dependencies:
  build_runner: ^2.10.5
  freezed: ^3.2.5
  hive_ce_generator: ^1.11.1
  json_serializable: ^6.11.4
  mocktail: ^1.0.4
  test: ^1.29.0
  very_good_analysis: ^10.0.0

dependency_overrides:
  analyzer: ^10.0.0
  data_layer:
    path: ../../data_layer/packages/data_layer
  data_layer_flutter:
    path: ../../data_layer/packages/data_layer_flutter
  data_layer_hive:
    path: ../../data_layer/packages/data_layer_hive
  matcher: ^0.12.18
  meta: ^1.18.0
  serverpod_auth_core_client:
    path: ../../../serverpod/serverpod/modules/serverpod_auth/serverpod_auth_core/serverpod_auth_core_client
  serverpod_auth_idp_client:
    path: ../../../serverpod/serverpod/modules/serverpod_auth/serverpod_auth_idp/serverpod_auth_idp_client
  test: ^1.29.0
  test_api: ^0.7.9
