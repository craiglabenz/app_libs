services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: example
      POSTGRES_PASSWORD: "602f_BVGNgz0h2sCb9sKcz9r9J34k3Ea"
    volumes:
      - example_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "VA5jDfTzkEnt3MFQ6KNZGjzDhZC58J26"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: example_test
      POSTGRES_PASSWORD: "LCxrATDl-mRz57ISOul7yXSOxM6zTUi7"
    volumes:
      - example_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "_9ZNsH0S-RZ1G_aNaNp7qLGWm_yVceZe"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  example_data:
  example_test_data:
