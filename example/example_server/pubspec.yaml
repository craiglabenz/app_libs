name: example_server
description: Starting point for a Serverpod server.
resolution: workspace

environment:
  sdk: '^3.10.0'

dependencies:
  example_shared:
    path: ../example_shared
  serverpod: any
  serverpod_auth_idp_server: any
  uuid: ^4.5.3

dev_dependencies:
  serverpod_test: any
  test: any
  very_good_analysis: any

serverpod:
  scripts:
    # Starts the server and applies migrations
    start: dart bin/main.dart --apply-migrations

    # Build the Flutter web app and copy it to the server's web directory.
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    flutter_build:
      windows: >-
        (if exist web\app rmdir /S /Q web\app) & cd /D ..\example_flutter &&
        flutter build web --base-href /app/ --wasm && xcopy /E /I /Y build\web
        ..\example_server\web\app
      posix: |
        cd ../example_flutter
        flutter build web --base-href /app/ --wasm --output ../example_server/web/app
