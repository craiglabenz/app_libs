name: example_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.8.0'

#resolution: workspace #--UNCOMMENT_LINE--#

dependencies:
  serverpod: 3.3.1
  serverpod_auth_idp_server: 3.2.0

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 3.3.1
  test: ^1.25.5

serverpod:
  scripts:
    # Starts the server and applies migrations
    start: dart bin/main.dart --apply-migrations

    # Build the Flutter web app and copy it to the server's web directory.
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    flutter_build:
      windows: >-
        (if exist web\app rmdir /S /Q web\app)
        & cd /D ..\example_flutter
        && flutter build web --base-href /app/ --wasm
        && xcopy /E /I /Y build\web ..\example_server\web\app
      posix: |
        cd ../example_flutter
        flutter build web --base-href /app/ --wasm --output ../example_server/web/app
dependency_overrides:
  serverpod_auth_core_server:
    path: /Users/craiglabenz/Dev/git/serverpod/serverpod/modules/serverpod_auth/serverpod_auth_core/serverpod_auth_core_server
  serverpod_auth_idp_server:
    path: /Users/craiglabenz/Dev/git/serverpod/serverpod/modules/serverpod_auth/serverpod_auth_idp/serverpod_auth_idp_server
