name: example_flutter
description: A new Flutter project with Serverpod.
resolution: workspace
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: '^3.10.0'
  flutter: '^3.32.0'

dependencies:
  example_client:
    path: ../example_client
  example_shared:
    path: ../example_shared
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: any
  get_it: ^9.2.1
  go_router: ^17.1.0
  json_annotation: any
  logging: any
  meta: any
  provider: ^6.1.5+1
  serverpod_auth_idp_flutter: any
  serverpod_flutter: any

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: any
  build_version: any
  flutter_gen_runner: ^5.10.0
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  freezed: any
  hive_ce_generator: any
  json_serializable: any
  mocktail: any
  very_good_analysis: any

dependency_overrides:
  flutter_secure_storage: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config.json
