name: workspace_resolver
publish_to: none
environment:
  sdk: ^3.10.0
workspace:
  - example_flutter
  - example_server
  - example_shared

dependencies:
  equatable: ^2.0.8
  freezed_annotation: ^3.1.0
  hive_ce: ^2.19.1
  hive_ce_flutter: ^2.3.4
  json_annotation: ^4.9.0
  logging: ^1.3.0
  meta: ^1.18.0
  serverpod: 3.3.1
  serverpod_auth_core_client: 3.3.1
  serverpod_auth_core_flutter: 3.3.1
  serverpod_auth_core_server: 3.3.1
  serverpod_auth_idp_client: 3.3.1
  serverpod_auth_idp_flutter: 3.3.1
  serverpod_auth_idp_server: 3.3.1
  serverpod_client: 3.3.1
  serverpod_flutter: 3.3.1

dev_dependencies:
  build_runner: ^2.10.5
  build_version: ^2.1.1
  freezed: ^3.2.4
  hive_ce_generator: ^1.11.1
  json_serializable: ^6.11.4
  mocktail: ^1.0.4
  sentry_dart_plugin: ^3.1.1
  serverpod_test: 3.3.1
  test: ^1.29.0
  very_good_analysis: ^10.0.0

# sentry:
#   upload_debug_symbols: true
#   upload_source_maps: true
#   project: flutter
#   org: hexonacci

dependency_overrides:
  analyzer: ^10.0.0
  data_layer:
    path: ../../data_layer/packages/data_layer
  data_layer_flutter:
    path: ../../data_layer/packages/data_layer_flutter
  data_layer_hive:
    path: ../../data_layer/packages/data_layer_hive
  matcher: ^0.12.18
  meta: ^1.18.0
  serverpod:
    path: ../../../serverpod/serverpod/packages/serverpod
  serverpod_auth_core_client:
    path: ../../../serverpod/serverpod/modules/serverpod_auth/serverpod_auth_core/serverpod_auth_core_client
  serverpod_auth_core_server:
    path: ../../../serverpod/serverpod/modules/serverpod_auth/serverpod_auth_core/serverpod_auth_core_server
  serverpod_auth_idp_client:
    path: ../../../serverpod/serverpod/modules/serverpod_auth/serverpod_auth_idp/serverpod_auth_idp_client
  serverpod_auth_idp_flutter:
    path: ../../../serverpod/serverpod/modules/serverpod_auth/serverpod_auth_idp/serverpod_auth_idp_flutter
  serverpod_auth_idp_server:
    path: ../../../serverpod/serverpod/modules/serverpod_auth/serverpod_auth_idp/serverpod_auth_idp_server
  test: ^1.29.0
  test_api: ^0.7.9
